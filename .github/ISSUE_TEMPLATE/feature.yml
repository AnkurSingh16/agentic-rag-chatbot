name: Feature
description: A new capability or a change in behaviour
labels: ['type:feat']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance criteria
      description: How we will know it is done. Measurable where possible.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
