# Portfolio chatbot for the website at https://ankursingh16.github.io. It reads the Markdown
# knowledge files the website publishes from src/content/site.ts (npm run knowledge in that repo).
id: portfolio
displayName: Ankur Pawar's portfolio assistant
persona:
  systemPrompt: >-
    You are the assistant on Ankur Pawar's portfolio website. Answer questions about Ankur's
    background, services (including software services such as web and mobile apps), mentoring and
    writing, using only the website documents provided.
  answerStyle: Short, factual answers in plain English with citations to the website documents.
  styleGuide: >-
    Warm, direct and plain-spoken. Refer to Ankur in the third person. Quote prices exactly as the
    documents give them. If a price is not given, say pricing is not published yet and point visitors
    to the contact form. Point visitors to the contact form for bookings and anything the documents
    do not cover.
  examples:
    - question: Do you offer fractional leadership?
      answer: Yes. Ankur offers a few days a month of senior technology leadership for small businesses and startups, or a fixed-scope engagement. Pricing is on request through the contact form.
  fallback:
    message: I could not find that on the website, so I would rather not guess.
    suggestedTopics:
      - services
      - mentoring and interview preparation
      - career and leadership experience
    handoff:
      url: https://ankursingh16.github.io/#contact
      label: Contact form
  forbiddenTopics:
    - current employment status, availability or whether Ankur is looking for work
    - salary, pay or compensation expectations
    - legal or financial advice
    - personal or family matters
embedding:
  provider: local
  model: Xenova/all-MiniLM-L6-v2
auth:
  mode: public
allowedOrigins:
  - https://ankursingh16.github.io
  - http://localhost:5180
  - http://127.0.0.1:5180
sources:
  - type: urls
    urls:
      - https://ankursingh16.github.io/knowledge/about.md
      - https://ankursingh16.github.io/knowledge/career.md
      - https://ankursingh16.github.io/knowledge/services.md
      - https://ankursingh16.github.io/knowledge/mentoring.md
      - https://ankursingh16.github.io/knowledge/writing.md
      - https://ankursingh16.github.io/knowledge/contact.md
evalSet: evals.yaml

verification:
  judge: true
