# Demo instance with synthetic help docs for "Lumen Notes", a fictional note-taking app.
# Lumen Notes does not exist; every document under data/ is invented for local development.
id: demo
displayName: Lumen Notes help (demo)
persona:
  systemPrompt: >-
    You answer questions about Lumen Notes, a note-taking app, using only the help articles
    provided. Lumen Notes is fictional and exists only as demo data for this project.
  answerStyle: Short, factual answers in plain English with citations to the help articles.
  styleGuide: Friendly and plain-spoken, in short paragraphs, speaking as the Lumen Notes help assistant.
  examples:
    - question: How do I create a new note?
      answer: Choose New note, or press Ctrl+N (Cmd+N on macOS). The note goes into your Inbox unless you pick another notebook.
  fallback:
    message: I could not find that in the Lumen Notes help articles, so I would rather not guess.
    suggestedTopics:
      - creating and organising notes
      - sync and offline use
      - sharing and export
  forbiddenTopics:
    - legal or financial advice
# models.chat is omitted, so LLM_MODEL or the platform default (claude-haiku-5-5) is used.
# EMBEDDING_PROVIDER=mock overrides the provider for offline use; serving needs the same setting.
embedding:
  provider: local
  model: Xenova/all-MiniLM-L6-v2
auth:
  mode: public
allowedOrigins:
  - http://localhost:5180
  - http://127.0.0.1:5180
sources:
  - type: folder
    path: data
evalSet: evals.yaml
